# Inference (MLflow model server) + webapp (upload UI).
# - From source (development): `make model && make up` builds both images locally.
# - Released images (deployment): `make deploy TAG=X.Y.Z` pulls them from ghcr.io, no build.
services:
  inference:
    image: ghcr.io/thibaudchevrier/fashion-serving-inference:${TAG:-latest}
    build:
      context: .
      dockerfile: inference/Dockerfile
    ports:
      - "5001:5000" # host 5000 is taken by AirPlay on macOS
    restart: unless-stopped

  webapp:
    image: ghcr.io/thibaudchevrier/fashion-serving-webapp:${TAG:-latest}
    build: webapp
    ports:
      - "8000:8000"
    environment:
      INFERENCE_URL: http://inference:5000
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
      MIN_SCORE: # optional; the contract's default (0.7) when unset
    volumes:
      - uploads:/data/uploads
    depends_on:
      inference:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads:
