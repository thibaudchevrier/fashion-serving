# Install once: uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
repos:
  - repo: local
    hooks:
      - id: commitizen
        name: conventional commit message
        entry: uv run cz check --allow-abort --commit-msg-file
        language: system
        stages: [commit-msg]
      - id: ruff-format
        name: ruff format
        entry: uv run --project webapp ruff format
        language: system
        types: [python]
        files: ^(webapp|scripts)/
      - id: ruff-check
        name: ruff check
        entry: uv run --project webapp ruff check --fix
        language: system
        types: [python]
        files: ^(webapp|scripts)/
