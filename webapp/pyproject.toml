[project]
name = "fashion-webapp"
version = "0.1.0"
description = "Upload photos, get clothing segmentation from the inference service, display the results"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_webapp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.pylint.format]
max-line-length = 100
