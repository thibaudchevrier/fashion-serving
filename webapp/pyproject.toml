[project]
name = "fashion-webapp"
version = "0.1.0"
description = "Upload photos, get clothing segmentation from the inference service, display the results"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fashion-seg-contract",
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fashion_webapp"]

[tool.pytest.ini_options]
# Docstring examples are tests too.
testpaths = ["src", "tests"]
addopts = "--doctest-modules"

[dependency-groups]
dev = [
    "fashion-seg-contract[validate]",
    "pydoclint>=0.10.0",
    "pylint>=4.0.9",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.pylint.format]
max-line-length = 100

[tool.uv.sources]
# Released wheel, referenced by URL like a package from a registry (GitHub Releases).
fashion-seg-contract = { url = "https://github.com/thibaudchevrier/fashion-seg-contract/releases/download/v0.2.0/fashion_seg_contract-0.2.0-py3-none-any.whl" }
