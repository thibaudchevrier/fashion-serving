[project]
name = "fashion-serving"
version = "0.1.1"
description = "Local serving of the fashion Mask R-CNN: MLflow inference service + Flask web app"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# Repo tooling: DVC fetches the model packaged by fashion-seg-train.
dev = [
    "commitizen>=4.19",
    "dvc[gdrive]>=3.59",
    "pre-commit>=4",
    "pyopenssl>=24.2.1",
]

[tool.uv]
package = false

# Lint config for all Python code (webapp/ and scripts/); pylint's is in webapp/pyproject.toml.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["models"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, simplify, docstrings
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D"]

[tool.ruff.lint.isort]
known-first-party = ["fashion_webapp"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Every parameter, return value and raised exception is documented (numpy style), with types
# matching the signature's annotations. Tests only need short docstrings (ruff D).
[tool.pydoclint]
style = "numpy"
exclude = '\.venv|tests|models'
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
check-return-types = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"          # bumps pyproject.toml and uv.lock together
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
major_version_zero = true        # breaking changes bump the minor version while < 1.0
