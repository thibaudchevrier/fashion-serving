name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Every commit of the PR follows Conventional Commits
        run: >-
          uvx --from commitizen==4.19.0 cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  quality:
    name: Lint (pre-commit hooks = make lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make lint

  tests:
    name: Webapp and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --project webapp
      - run: make test

  docker:
    # Dockerfiles are linted (hadolint) by the pre-commit hooks in the lint job.
    name: Webapp image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build webapp image
        run: docker build -t fashion-webapp:ci webapp

  secrets-check:
    name: Detect DVC credentials
    runs-on: ubuntu-latest
    outputs:
      gdrive: ${{ steps.check.outputs.gdrive }}
    steps:
      - id: check
        env:
          HAS_GDRIVE: ${{ secrets.GDRIVE_CREDENTIALS_DATA != '' }}
        run: |
          echo "gdrive=$HAS_GDRIVE" >> "$GITHUB_OUTPUT"
          if [ "$HAS_GDRIVE" != "true" ]; then
            echo "::notice::GDRIVE_CREDENTIALS_DATA is not set: end-to-end test is skipped (see README)."
          fi

  e2e:
    name: End-to-end (real model in docker compose)
    needs: [secrets-check, docker]
    if: needs.secrets-check.outputs.gdrive == 'true'
    runs-on: ubuntu-latest
    env:
      # Service account JSON key, read by DVC's Google Drive remote.
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - name: Configure access to fashion-seg-train's DVC remote
        run: |
          cat > .dvc/fashion-seg-train.config.local <<'CFG'
          ['remote "myremote"']
              gdrive_use_service_account = true
          CFG
      - name: Fetch the pinned model
        run: make model
      - name: Start the stack
        run: make up
      - name: Smoke test (contract + upload flow)
        run: make smoke
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: make down
